plugins { id 'com.android.application' }
android {
    namespace 'com.neuro.engine'
    compileSdk 34
    defaultConfig {
        applicationId "com.neuro.engine"
        minSdk 24
        targetSdk 33
        versionCode 10
        versionName "10.0-ULTRA"
        externalNativeBuild { cmake { cppFlags "-std=c++17 -O3 -fvisibility=hidden"; abiFilters "arm64-v8a" } }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    externalNativeBuild { cmake { path "src/main/cpp/CMakeLists.txt"; version "3.22.1" } }
}
dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
