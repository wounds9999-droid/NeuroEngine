name: Final Guaranteed Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Install NDK & CMake
      run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"
    - name: Pre-setup NCNN
      run: |
        mkdir -p app/src/main/cpp/ncnn
        cd app/src/main/cpp
        wget https://github.com/Tencent/ncnn/releases/download/20231027/ncnn-20231027-android-vulkan.zip -O ncnn.zip
        unzip -q ncnn.zip
        # نقل المحتويات للمجلد اللي ينتظره CMake
        cp -r ncnn-20231027-android-vulkan/* ncnn/
    - name: Build APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NeuroEngine-Final
        path: app/build/outputs/apk/debug/app-debug.apk
