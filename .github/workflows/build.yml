name: NeuroEngine Native Compile
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Install Android Components
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"
    - name: Inject Cloud Paths
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "cmake.dir=$ANDROID_HOME/cmake/3.22.1" >> local.properties
    - name: Download NCNN Core
      run: |
        cd app/src/main/cpp
        wget https://github.com/Tencent/ncnn/releases/download/20231027/ncnn-20231027-android-vulkan.zip -O ncnn.zip
        unzip -q ncnn.zip && rm ncnn.zip && mv ncnn-20231027-android-vulkan ncnn
    - name: Execute Compiler
      run: |
        wget https://services.gradle.org/distributions/gradle-8.2-bin.zip
        unzip -q gradle-8.2-bin.zip -d /tmp
        /tmp/gradle-8.2/bin/gradle assembleDebug
    - name: Extract C++ Compiler Logs (On Failure)
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: Ninja-CXX-Errors
        path: app/.cxx/
