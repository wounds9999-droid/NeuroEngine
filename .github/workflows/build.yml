name: NeuroEngine Final Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Auto-Build APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace
 
